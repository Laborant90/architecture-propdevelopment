# support-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: support-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch",  "update", "patch"] 
  - apiGroups: [""]
    resources: [ "deployments" ]
    verbs: [ "get", "list", "watch" ]